
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Location service: warehouse-specific locations
            - id: location-warehouse-locations
              uri: http://localhost:8082
              order: -1
              predicates:
                - Path=/api/v1/warehouses/*/locations

            # Warehouse service
            - id: warehouse-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/warehouses/**

            # Location and bin service
            - id: location-bin-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/locations/**,/api/v1/bins/**

            # Inbound service
            - id: inbound-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/goods-receipts/**

            # Put-away service
            - id: putaway-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/putaway/tasks/**

            # Inventory service
            - id: inventory-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/v1/inventory/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  info:
    env:
      enabled: true

info:
  app:
    name: WMS API Gateway
    version: 1.0.0

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-32-byte-secret-key}