spring.application.name=location-bin-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/location_bin_db
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

services.warehouse.base-url=${WAREHOUSE_SERVICE_URL:http://localhost:8081}
services.warehouse.username=${WAREHOUSE_SERVICE_USERNAME:wmsuser}
services.warehouse.password=${WAREHOUSE_SERVICE_PASSWORD:ChangeMe123!}
wms.warehouse.base-url=http://localhost:8081
wms.warehouse.username=${WMS_WAREHOUSE_USERNAME:wmsuser}
wms.warehouse.password=${WMS_WAREHOUSE_PASSWORD:ChangeMe123!}

# Actuator monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Application information
info.app.name=${spring.application.name}
info.app.version=1.0.0

# Consistent logs with correlation ID
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId:-N/A}] %logger{36} - %msg%n
security.jwt.secret=${JWT_SECRET:dev-only-change-me-32-byte-secret-key}