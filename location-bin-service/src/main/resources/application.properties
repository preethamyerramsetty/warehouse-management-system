spring.application.name=location-bin-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/location_bin_db
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

services.warehouse.base-url=${WAREHOUSE_SERVICE_URL:http://localhost:8081}
services.warehouse.username=${WAREHOUSE_SERVICE_USERNAME:wmsuser}
services.warehouse.password=${WAREHOUSE_SERVICE_PASSWORD:ChangeMe123!}