spring.application.name=warehouse-service

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/warehouse_db
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Actuator monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Application information
info.app.name=${spring.application.name}
info.app.version=1.0.0

# Consistent logs with correlation ID
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId:-N/A}] %logger{36} - %msg%n
security.jwt.secret=${JWT_SECRET:dev-only-change-me-32-byte-secret-key}